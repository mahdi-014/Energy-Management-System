version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: dcems-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto.passwd:/mosquitto/config/mosquitto.passwd:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: dcems-backend
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ../data:/app/data
      - ../dashboard:/app/dashboard:ro

volumes:
  mosquitto_data:
  mosquitto_log:

