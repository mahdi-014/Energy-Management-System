# Eclipse Mosquitto Configuration for DCEMS
# Private LAN-Only Broker

listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd

# Persistence for retained messages (dcems/room1/state, dcems/room1/status)
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
